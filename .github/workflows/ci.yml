name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Estilo, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Estilo (ESLint)
        run: npm run lint
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Cache dos EPWs de teste
        uses: actions/cache@v6
        with:
          path: .cache/epw
          key: epw-${{ hashFiles('docs/validacao/casos/epw/manifesto.json') }}
      - name: EPWs de teste (decisão 0010)
        run: python3 docs/validacao/scripts/baixar_epw.py
      - name: Testes de unidade e de referência (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Orçamento do JavaScript inicial (decisão 0039)
        run: npm run orcamento

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Testes de ponta a ponta
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
