# Releases a partir do CHANGELOG.md (decisão 0012).
#
# A cada push na main que altera o CHANGELOG (ou manualmente), cria no GitHub as releases das
# versões que constam do CHANGELOG e ainda não existem. A tag aponta para o commit que introduziu o
# cabeçalho da versão; as notas são o texto da seção. Versões 0.x saem como pré-lançamento.
name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Criar releases do CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Criar releases que faltam
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts
